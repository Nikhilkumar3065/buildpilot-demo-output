<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BuildPilot responsive demo page">
  <title>BuildPilot Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-50 text-gray-900 antialiased">
  <main class="min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 lg:p-8">
    <div class="w-full max-w-2xl bg-white rounded-xl shadow-md p-6 sm:p-8">
      <h1 class="text-2xl sm:text-3xl lg:text-4xl font-bold text-center mb-4">
        BuildPilot Demo
      </h1>
      <p class="text-base sm:text-lg text-center text-gray-600 mb-6 leading-relaxed">
        Responsive, mobile-friendly interface with accessible touch targets and readable typography.
      </p>
      <div class="flex flex-col sm:flex-row gap-3 sm:gap-4 justify-center">
        <button
          type="button"
          class="min-h-11 min-w-11 px-6 py-3 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-medium rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
        >
          Get Started
        </button>
        <button
          type="button"
          class="min-h-11 min-w-11 px-6 py-3 bg-gray-200 hover:bg-gray-300 active:bg-gray-400 text-gray-800 font-medium rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2"
        >
          Learn More
        </button>
      </div>
    </div>
  </main>
</body>
</html>
